name: sync-dev-manifest

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - sync-dev-manifest
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-dev-manifest
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Sync Entrox dev manifest
        run: |
          set -euo pipefail
          status=0
          python3 - <<'PY' || status=$?
          import json
          import pathlib
          import sys
          import time
          import urllib.error
          import urllib.request

          manifest_path = pathlib.Path("bucket/entrox.json")
          current_manifest = json.loads(manifest_path.read_text()) if manifest_path.exists() else {}
          latest_url = "https://entrox.996icu.wiki/downloads/entrox-dev/latest.json"
          attempts = 3
          timeout = 20
          unavailable_exit = 75

          def fetch(url: str) -> dict:
              for attempt in range(1, attempts + 1):
                  try:
                      request = urllib.request.Request(url, headers={"User-Agent": "entrox-tap-sync"})
                      with urllib.request.urlopen(request, timeout=timeout) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code != 429 and error.code < 500:
                          raise
                      reason = f"HTTP {error.code}"
                  except (urllib.error.URLError, TimeoutError) as error:
                      reason = f"{type(error).__name__}: {error}"
                  except json.JSONDecodeError as error:
                      reason = f"response was not JSON: {error}"
                  print(f"attempt {attempt}/{attempts} failed ({reason})", file=sys.stderr)
                  if attempt < attempts:
                      time.sleep(3 * 2 ** (attempt - 1))
              print(f"{url} is unavailable after {attempts} attempts", file=sys.stderr)
              sys.exit(unavailable_exit)

          latest = fetch(latest_url)

          version = latest.get("version") or current_manifest.get("version", "0.0.0-ci")
          assets = {asset["name"]: asset for asset in latest.get("assets", [])}
          asset_name = "entrox-cli-windows-x64.zip"
          windows_x64 = assets.get(asset_name)
          if not windows_x64:
              raise RuntimeError(f"missing {asset_name} in {latest_url}")
          if not windows_x64.get("url") or not windows_x64.get("sha256"):
              raise RuntimeError(f"missing url or sha256 for {asset_name} in {latest_url}")

          manifest = {
              "version": version,
              "description": "Entrox CLI",
              "homepage": "https://entrox.996icu.wiki",
              "license": "MIT",
              "architecture": {
                  "64bit": {
                      "url": windows_x64["url"],
                      "hash": windows_x64["sha256"],
                  }
              },
              "bin": r"bin\entrox.exe",
          }
          manifest_path.parent.mkdir(exist_ok=True)
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          if [ "$status" -eq 75 ]; then
            echo "::notice title=Upstream unavailable::Dev manifest service is unreachable; leaving the manifest untouched."
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          python3 -m json.tool bucket/entrox.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/entrox.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Entrox dev Scoop manifest"
            git push
          fi
